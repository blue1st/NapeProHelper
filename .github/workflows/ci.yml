name: 'CI'

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Run Tests & Build Check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node Dependencies
        run: npm ci

      - name: Frontend Build Check
        run: npm run build

      - name: Run Backend Unit Tests (Cargo Test)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
